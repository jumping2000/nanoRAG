[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "nanorag-backend"
version = "0.1.0"
description = "Minimal modular backend for agentic RAG with hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "agno>=1.0.0",
  "python-dotenv>=1.0.0",
  "qdrant-client>=1.10.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "ollama>=0.4.0",
  "tiktoken>=0.7.0",
  "torch>=2.8.0,<3.0.0",
  "mcp>=1.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["data/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require external services (MCP server, backend, etc.)",
]
