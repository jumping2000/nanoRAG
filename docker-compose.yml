x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nanorag_chunks}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
  CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-450}
  CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-80}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
  MCP_API_KEY: ${MCP_API_KEY:-changeme}
  MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8100}
services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 10

  backend:
    container_name: nanorag-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 6

  frontend:
    container_name: nanorag-web
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 6

  # MCP is run as a subprocess inside the `backend` container (stdio transport).
  # Optional: run MCP as a separate HTTP service (streamable-http transport).
  mcp-server:
    container_name: nanorag-mcp
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      MCP_TRANSPORT: streamable-http
    ports:
      - "${MCP_HTTP_PORT:-8100}:${MCP_HTTP_PORT:-8100}"
    command: ["python", "backend/mcp_server_start.py"]
    volumes:
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; port=os.environ.get('MCP_HTTP_PORT','8100'); urllib.request.urlopen(f'http://127.0.0.1:{port}/mcp/nanorag_health')\""]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
